# Secret scanning gate (rolled out org-wide; source of truth: terraform-provider-airtelcloud).
#
#   PRs / pushes : scan only the new commits (TruffleHog) + the files (Trivy, incl. Airtel key rules)
#   Weekly / manual : scan the full git history of all branches and tags
#
# Fails on live or unverifiable credentials. Required check name: "secrets-gate".
# Scanners are downloaded from their GitHub releases and checksum-verified; no third-party actions.

name: secrets

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 2 * * 1" # Mondays 07:47 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRUFFLEHOG_VERSION: "3.99.2"
  TRIVY_VERSION: "0.76.0"

jobs:
  secrets-gate:
    name: secrets-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install TruffleHog and Trivy (checksum-verified)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"

          th="https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}"
          curl -fsSL -o "$tmp/th.tgz"  "$th/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tmp/th.sum" "$th/trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt"
          echo "$(grep " trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz$" "$tmp/th.sum" | cut -d' ' -f1)  $tmp/th.tgz" | sha256sum -c -
          tar -xzf "$tmp/th.tgz" -C "$tmp" trufflehog

          tv="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -fsSL -o "$tmp/tv.tgz"  "$tv/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$tmp/tv.sum" "$tv/trivy_${TRIVY_VERSION}_checksums.txt"
          echo "$(grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" "$tmp/tv.sum" | cut -d' ' -f1)  $tmp/tv.tgz" | sha256sum -c -
          tar -xzf "$tmp/tv.tgz" -C "$tmp" trivy

          sudo install -m 0755 "$tmp/trufflehog" "$tmp/trivy" /usr/local/bin/
          trufflehog --version && trivy --version | head -1

      - name: Decide scan range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mode=full base="" head=""
          if [[ "$EVENT" == "pull_request" ]]; then
            mode=diff base="$PR_BASE" head="$PR_HEAD"
          elif [[ "$EVENT" == "push" && -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            mode=diff base="$PUSH_BEFORE" head="$GITHUB_SHA"
          fi
          { echo "mode=$mode"; echo "base=$base"; echo "head=$head"; } >> "$GITHUB_OUTPUT"
          echo "Secret scan mode: **$mode**" >> "$GITHUB_STEP_SUMMARY"

      # Fails on "verified" (live key: rotate now) and "unknown" (couldn't verify: treat as live).
      # A revoked key comes back "unverified" and does not fail.
      - name: TruffleHog (git history)
        env:
          MODE: ${{ steps.range.outputs.mode }}
          BASE: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          args=(git "file://${GITHUB_WORKSPACE}" --results=verified,unknown --fail --no-update --github-actions)
          [[ -f .github/trufflehog-exclude.txt ]] && args+=(--exclude-paths=.github/trufflehog-exclude.txt)
          [[ "$MODE" == "diff" ]] && args+=(--since-commit="$BASE" --branch="$HEAD_SHA")
          trufflehog "${args[@]}"

      # Catches Airtel Cloud keys (TruffleHog has no detector for them) and other secret patterns in files.
      - name: Trivy (files, incl. Airtel Cloud key rules)
        run: trivy fs --config .github/trivy.yaml --exit-code 1 --format table .
